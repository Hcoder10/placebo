id: key_unlocks_matching_chest
requirement: >-
  Using a key unlocks the chest that key belongs to, and only that chest. Using
  a different key leaves this chest locked, and using nothing leaves everything
  locked.

# The world both conditions start from, rebuilt from nothing for each one.
setup: |
  local use = Instance.new("BindableEvent")
  use.Name = "Use"
  use.Parent = sandbox

  -- Two chests, so "unlocked the right one" is distinguishable from "unlocked
  -- everything". A mechanic that opens every chest satisfies a single-chest
  -- contract perfectly well, which is exactly the bug this pairing catches.
  local chestA = Instance.new("Part")
  chestA.Name = "ChestA"
  chestA.Anchored = true
  chestA:SetAttribute("Locked", true)
  chestA:SetAttribute("KeyId", "KeyA")
  chestA.Parent = sandbox

  local chestB = Instance.new("Part")
  chestB.Name = "ChestB"
  chestB.Anchored = true
  chestB:SetAttribute("Locked", true)
  chestB:SetAttribute("KeyId", "KeyB")
  chestB.Parent = sandbox

# The intervention: the player uses the key that belongs to ChestA.
treatment: |
  for _ = 1, REALIZATION do
    sandbox.Use:Fire("KeyA")
  end

controls:
  - name: never_uses
    steps: |
      -- same world, same elapsed setup, no key is ever used

  # The discriminating control. A mechanic that unlocks on any key at all
  # produces this contract's effect here too, and a control that reproduces the
  # treatment's effect is what tells the verifier the effect was not caused by
  # the treatment specifically.
  - name: uses_other_key
    steps: |
      for _ = 1, REALIZATION do
        sandbox.Use:Fire("KeyB")
      end

effects:
  - key: "ChestA.@Locked"
    change: "true->false"

non_effects:
  - "ChestB.@Locked"

# Repeated use must not re-open or toggle an already-open chest.
realizations: [1, 2]
