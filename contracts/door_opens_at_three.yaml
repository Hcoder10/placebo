id: door_opens_at_three
requirement: >-
  When the player's third coin is collected, the door opens. Collecting fewer
  than three leaves it shut, and the door never opens on its own.

# No setup: this contract runs inside a task, which owns the shared world so
# every contract sees the same instances.

# Three collects — the interaction that should open the door.
# task.wait() between collects is load-bearing, not cosmetic. Collect:Fire is
# deferred, so without a yield all three fires queue up and the handlers run
# only after the loop has already replaced the coins — the mechanic then sees
# one coin, awards once, and the door never reaches its threshold.
#
# The replacement coin is built with the same kit constructor and the same
# coordinates as the one the task's setup placed, so coin two and coin three are
# the same object as coin one in every respect a player or the verifier can see.
# The control below replaces it identically; the two conditions differ in how
# many times the signal fires and in nothing else.
treatment: |
  for _ = 1, 3 do
    sandbox.Collect:Fire("P1")
    task.wait()
    if not sandbox:FindFirstChild("Coin") then
      kit.coin(sandbox, 0, 14, 67, "Coin")
    end
  end

controls:
  # Two collects. One short of the threshold, so the door must stay shut. This
  # is the control that catches "opens on any collect" and "opens at startup"
  # with one comparison.
  - name: two_collects
    steps: |
      for _ = 1, 2 do
        sandbox.Collect:Fire("P1")
        task.wait()
        if not sandbox:FindFirstChild("Coin") then
          kit.coin(sandbox, 0, 14, 67, "Coin")
        end
      end

  - name: no_collect
    steps: |
      -- the player never collects anything

effects:
  - key: "Door.@Open"
    change: "false->true"

non_effects:
  - "OtherScoreboard.@Coins"

realizations: [1]
