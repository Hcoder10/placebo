name: roblox-deprecations
revision: 1
description: >-
  Deprecated Roblox API members and their replacements. Feeds the curriculum
  generator: the web proposes what changed, and the engine decides whether the
  resulting task is real.

url: https://create.roblox.com/docs/reference/engine/deprecations

fetch:
  # Swap to `brightdata` for a live run; the fixture keeps the repair
  # demonstration deterministic and network-free.
  via: fixture
  zone: web_unlocker1
  fixture: roblox-deprecations-v1.html

record_selector: ".deprecation"

# Declaration order is meaningful: it is what lets two fields of the same shape
# (member and replacement are both identifiers) be told apart after a redesign.
fields:
  class_name:
    selector: ".api-class"
    validator: class-name
  member:
    selector: ".api-member"
    validator: identifier
  replacement:
    selector: ".api-replacement"
    validator: identifier
  deprecated_in:
    selector: ".api-version"
    pattern: '(\d+\.\d+)'
    validator: semver

repairs: []
